[project]
name = "simulador-acustico-web"
version = "0.1.0"
description = "Simulador web de acústica de recintos con pyroomacoustics y FastAPI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyroomacoustics>=0.7.3",
]

[tool.ruff]
line-length = 100
